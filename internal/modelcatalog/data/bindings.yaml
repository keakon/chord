# Verified endpoint bindings: which wire model ID each endpoint serves, the
# endpoint-specific reasoning variants verified for the route, and the optional
# Responses fields the binding sends by default. A binding may later carry
# field-level overrides (limit, modalities) for models whose verified values
# differ on that endpoint; none of the first batch needs one.
bindings:
  # Codex OAuth route: every wire model shares the same verified Responses
  # send defaults and reasoning-effort variants.
  - endpoint: codex
    wire_model_id: gpt-5.6-luna
    model_id: openai/gpt-5.6-luna
    responses:
      send_store: true
      send_parallel_tool_calls: true
    variants:
      low: { reasoning_effort: low }
      high: { reasoning_effort: high }
      xhigh: { reasoning_effort: xhigh }

  - endpoint: codex
    wire_model_id: gpt-5.6-sol
    model_id: openai/gpt-5.6-sol
    responses:
      send_store: true
      send_parallel_tool_calls: true
    variants:
      low: { reasoning_effort: low }
      high: { reasoning_effort: high }
      xhigh: { reasoning_effort: xhigh }

  - endpoint: codex
    wire_model_id: gpt-5.6-terra
    model_id: openai/gpt-5.6-terra
    responses:
      send_store: true
      send_parallel_tool_calls: true
    variants:
      low: { reasoning_effort: low }
      high: { reasoning_effort: high }
      xhigh: { reasoning_effort: xhigh }

  - endpoint: codex
    wire_model_id: gpt-6-astra
    model_id: openai/gpt-6-astra
    responses:
      send_store: true
      send_parallel_tool_calls: true
    variants:
      low: { reasoning_effort: low }
      medium: { reasoning_effort: medium }
      high: { reasoning_effort: high }
      xhigh: { reasoning_effort: xhigh }
