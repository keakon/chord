name: performance

on:
  push:
    branches:
      - "**"
    paths:
      - "internal/tui/**"
      - "internal/llm/**"
      - "internal/session/**"
      - "internal/recovery/**"
      - "internal/agent/**"
      - "internal/tools/**"
      - "internal/textdiff/**"
      - "internal/textfile/**"
      - "internal/texttruncate/**"
      - "internal/tooloutput/**"
      - "internal/shellanalysis/**"
      - "internal/reasoningtext/**"
      - "internal/webcontent/**"
      - "internal/textclean/**"
      - "internal/filefilter/**"
      - "internal/contextdiag/**"
      - "internal/gitinspect/**"
      - "internal/schemaargs/**"
      - "internal/permission/**"
      - "scripts/bench_tui_regression.sh"
      - ".github/workflows/performance.yml"
  pull_request:
    paths:
      - "internal/tui/**"
      - "internal/llm/**"
      - "internal/session/**"
      - "internal/recovery/**"
      - "internal/agent/**"
      - "internal/tools/**"
      - "internal/textdiff/**"
      - "internal/textfile/**"
      - "internal/texttruncate/**"
      - "internal/tooloutput/**"
      - "internal/shellanalysis/**"
      - "internal/reasoningtext/**"
      - "internal/webcontent/**"
      - "internal/textclean/**"
      - "internal/filefilter/**"
      - "internal/contextdiag/**"
      - "internal/gitinspect/**"
      - "internal/schemaargs/**"
      - "internal/permission/**"
      - "scripts/bench_tui_regression.sh"
      - ".github/workflows/performance.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tui-benchmarks:
    name: Runtime benchmark smoke
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Go
        id: setup-go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Locate managed Go build cache
        id: managed-cache
        shell: bash
        run: |
          cache_root="${XDG_CACHE_HOME:-$HOME/.cache}/chord/build-cache"
          mkdir -p -m 700 "$cache_root"
          printf 'path=%s/go-build\n' "$cache_root" >> "$GITHUB_OUTPUT"

      - name: Cache managed Go build outputs
        uses: actions/cache@v5
        with:
          path: ${{ steps.managed-cache.outputs.path }}
          key: chord-go-build-${{ runner.os }}-${{ runner.arch }}-${{ steps.setup-go.outputs.go-version }}-${{ github.job }}-${{ github.sha }}
          restore-keys: |
            chord-go-build-${{ runner.os }}-${{ runner.arch }}-${{ steps.setup-go.outputs.go-version }}-${{ github.job }}-

      - name: Run runtime benchmark smoke
        env:
          CHORD_BENCH_TIME: 250ms
        run: scripts/bench_tui_regression.sh
