# Team-ready project baseline
#
# Keep the shared layout split across real files:
# - ~/.config/chord/config.yaml          personal defaults + providers
# - ~/.config/chord/auth.yaml            personal credentials
# - <repo>/.chord/config.yaml            shared project defaults
# - <repo>/.chord/agents/*.md            shared agent roles
#
# See docs/examples/examples-team*.md for the full multi-file layout.

providers:
  openai:
    preset: openai
    models:
      gpt-6-luna:
        catalog: false
        limit: {context: 1050000, output: 128000}
        modalities: {input: [text, image, pdf]}
        variants:
          low: {reasoning: {effort: low}}
          medium: {reasoning: {effort: medium}}
          high: {reasoning: {effort: high}}
          xhigh: {reasoning: {effort: xhigh}}
          max: {reasoning: {effort: max}}
  anthropic:
    preset: anthropic
    models:
      claude-opus-5-5: &claude
        catalog: false
        limit: {context: 1000000, output: 128000}
        modalities: {input: [text, image, pdf]}
        thinking:
          type: adaptive
        variants:
          low: {thinking: {effort: low}}
          medium: {thinking: {effort: medium}}
          high: {thinking: {effort: high}}
          xhigh: {thinking: {effort: xhigh}}
          max: {thinking: {effort: max}}
      claude-sonnet-5-5: *claude

model_pools:
  deep:
    - anthropic/claude-opus-5-5
  coding:
    - anthropic/claude-sonnet-5-5
  fast:
    - openai/gpt-6-luna

context:
  compaction:
    threshold: 0.8
    model_pool: coding
desktop_notification: true
log_level: info
