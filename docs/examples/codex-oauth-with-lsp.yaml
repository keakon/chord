# Codex OAuth + LSP workstation
#
# Pair with `chord auth codex` for ~/.config/chord/auth.yaml, and keep any
# extra agents in ~/.config/chord/agents/*.md instead of embedding them here.
#
# This example uses `gpt-6.1-sol` with `context=1050000`, `output=128000`.
# Chord defaults `max_output_tokens` to 64000, so its output budget is the
# smaller of 64000 and `limit.output` unless you override the global cap.

providers:
  codex:
    preset: codex
    type: responses
    models:
      gpt-6.1-sol:
        catalog: false
        limit:
          context: 1050000
          output: 128000
        reasoning:
          summary: auto
        variants:
          low:
            reasoning:
              effort: low
          medium:
            reasoning:
              effort: medium
          high:
            reasoning:
              effort: high
          xhigh:
            reasoning:
              effort: xhigh
          max:
            reasoning:
              effort: max
        modalities:
          input: [text, image, pdf]

  fast:
    type: chat-completions
    api_url: https://api.openai.com/v1/chat/completions
    models:
      gpt-5.4-mini:
        limit:
          context: 200000
          input: 183616
          output: 128000

model_pools:
  deep:
    - codex/gpt-6.1-sol
  fast:
    - fast/gpt-5.4-mini

lsp:
  gopls:
    command: gopls
    file_types: [".go"]
    root_markers: ["go.work", "go.mod", ".git"]
  pyright:
    command: pyright-langserver
    args: ["--stdio"]
    file_types: [".py", ".pyi"]
    options:
      python.analysis:
        typeCheckingMode: standard

context:
  compaction:
    threshold: 0.8
    model_pool: fast

desktop_notification: true
prevent_sleep: true
ime_switch_target: com.apple.keylayout.ABC
log_level: info
